services:
  db:
    image: postgres:15-alpine
    container_name: fit4110-db-lab06
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plugathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plugathon-local-pass}
      POSTGRES_DB: ${POSTGRES_DB:-notificationdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - plugathon-db-data:/var/lib/postgresql/data
    networks:
      - plugathon-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plugathon} -d ${POSTGRES_DB:-notificationdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: fit4110-mqtt-lab06
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ../05_Compose/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - plugathon-internal
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "1883", "-t", "health/ping", "-m", "ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../05_Compose
      dockerfile: Dockerfile
      target: runtime
    image: fit4110/notification-service:${IMAGE_TAG:-v1.0.0-plugathon}
    container_name: fit4110-api-lab06
    user: "10001:10001"
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: 8000 # Fixed container port; override host port via APP_PORT in ports below
      ENV: ${ENV:-plugathon}
      SERVICE_NAME: ${SERVICE_NAME:-notification-service}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      AUTH_TOKEN: ${AUTH_TOKEN:-plugathon-dev-token}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-plugathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plugathon-local-pass}
      POSTGRES_DB: ${POSTGRES_DB:-notificationdb}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-campus.alerts}
      MQTT_DLQ_TOPIC: ${MQTT_DLQ_TOPIC:-campus.alerts.dlq}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-notification-service-g7}
      MQTT_WORKER_THREADS: ${MQTT_WORKER_THREADS:-4}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_INTERVAL_SECONDS: ${RETRY_INTERVAL_SECONDS:-5}
      FAIL_CHANNELS: ${FAIL_CHANNELS:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-5}
    depends_on:
      db:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - plugathon-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  plugathon-internal:
    name: plugathon-internal
    driver: bridge

volumes:
  plugathon-db-data:
