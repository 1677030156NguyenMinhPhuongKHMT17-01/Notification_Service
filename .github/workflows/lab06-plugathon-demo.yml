name: Lab 06 - Plug-a-thon Integration and Demo Check

on:
  push:
    branches: [main]
    paths:
      - "06_Plugathon/**"
      - "05_Compose/**"
      - "demo/**"
      - ".github/workflows/lab06-plugathon-demo.yml"
  pull_request:
    paths:
      - "06_Plugathon/**"
      - "05_Compose/**"
      - "demo/**"
      - ".github/workflows/lab06-plugathon-demo.yml"
  workflow_dispatch:

jobs:
  plugathon-demo:
    name: Validate Lab 06 Plug-a-thon Stack, E2E & Demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: 06_Plugathon/package-lock.json

      - name: Install Newman and Spectral
        working-directory: 06_Plugathon
        run: npm ci

      - name: Verify frozen contracts parity (SHA-256)
        working-directory: 06_Plugathon
        run: python scripts/verify_frozen_contracts.py

      - name: Lint frozen OpenAPI contract
        working-directory: 06_Plugathon
        run: npm run lint:openapi

      - name: Check Python and demo script syntax
        run: |
          python -m py_compile 06_Plugathon/scripts/*.py
          python 06_Plugathon/scripts/core_business_simulator.py --help >/dev/null
          python 06_Plugathon/scripts/run_plugathon_e2e.py --help >/dev/null
          if [ -f demo/run_demo.sh ]; then
            bash -n demo/run_demo.sh
          fi
          if [ -f demo/run_demo.ps1 ] && command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$errs = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("demo/run_demo.ps1", [ref]$null, [ref]$errs); if ($errs.Count -gt 0) { throw $errs[0].Message }'
          fi

      - name: Create temporary .env from .env.example
        working-directory: 06_Plugathon
        run: cp .env.example .env

      - name: Validate Compose configs (standalone and external-broker overlay)
        working-directory: 06_Plugathon
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.external-broker.yml config --quiet

      - name: Build and start Lab 06 Plug-a-thon Compose stack
        working-directory: 06_Plugathon
        run: docker compose up -d --build --wait

      - name: Verify non-root container user and service readiness
        working-directory: 06_Plugathon
        run: |
          docker compose ps
          docker compose exec -T api id | grep -q 'uid=10001(appuser)'
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          set -a; source .env; set +a
          docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          docker compose exec -T mqtt-broker mosquitto_pub -h 127.0.0.1 -p 1883 -t health/ping -m ok

      - name: Run automated Plug-a-thon E2E and DLQ recovery suite
        working-directory: 06_Plugathon
        run: python scripts/run_plugathon_e2e.py --with-compose-dlq-recovery

      - name: Run Newman Plug-a-thon collection
        working-directory: 06_Plugathon
        run: npm run test:plugathon

      - name: Upload Lab 06 Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab06-plugathon-newman-reports
          path: 06_Plugathon/reports/

      - name: Dump Compose logs on failure
        if: failure()
        working-directory: 06_Plugathon
        run: docker compose logs

      - name: Tear down Compose stack and temporary .env
        if: always()
        working-directory: 06_Plugathon
        run: docker compose down -v && rm -f .env
