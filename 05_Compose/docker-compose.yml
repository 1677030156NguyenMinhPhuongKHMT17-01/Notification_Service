services:
  db:
    image: postgres:15-alpine
    container_name: fit4110-db-lab05
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab05}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab05pass}
      POSTGRES_DB: ${POSTGRES_DB:-notificationdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - team-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab05} -d ${POSTGRES_DB:-notificationdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: fit4110-mqtt-lab05
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - team-internal
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "1883", "-t", "health/ping", "-m", "ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fit4110/notification-service:${IMAGE_TAG:-v0.1.0-team-notify}
    container_name: fit4110-api-lab05
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: 8000 # Fixed container port; configure host port via APP_PORT in ports below
      ENV: ${ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-notification-service}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.5.0}
      AUTH_TOKEN: ${AUTH_TOKEN:-local-dev-token}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-lab05}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab05pass}
      POSTGRES_DB: ${POSTGRES_DB:-notificationdb}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-campus.alerts}
      MQTT_DLQ_TOPIC: ${MQTT_DLQ_TOPIC:-campus.alerts.dlq}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-notification-service-g6}
      MQTT_WORKER_THREADS: ${MQTT_WORKER_THREADS:-4}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_INTERVAL_SECONDS: ${RETRY_INTERVAL_SECONDS:-5}
      FAIL_CHANNELS: ${FAIL_CHANNELS:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-5}
    depends_on:
      db:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - team-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  team-internal:
    name: team-internal
    driver: bridge

volumes:
  db-data:

