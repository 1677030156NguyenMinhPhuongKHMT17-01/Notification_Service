name: Lab 05 - Notification Compose Readiness Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose-check:
    name: Validate Notification Compose Stack (API + PostgreSQL + MQTT)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: 05_Compose/package-lock.json

      - name: Install Newman + Spectral
        working-directory: 05_Compose
        run: npm ci

      - name: Lint OpenAPI contracts
        working-directory: 05_Compose
        run: npm run lint:openapi

      - name: Create .env from .env.example
        working-directory: 05_Compose
        run: cp .env.example .env

      - name: Lint docker-compose.yml
        working-directory: 05_Compose
        run: docker compose config --quiet

      - name: Run unit tests (Docker test stage)
        working-directory: 05_Compose
        run: docker build --target test -t fit4110/notification-service:test .

      - name: Build and start Compose stack
        working-directory: 05_Compose
        run: docker compose up -d --build --wait

      - name: Show running containers
        working-directory: 05_Compose
        run: docker compose ps

      - name: Verify non-root user and dependencies readiness
        working-directory: 05_Compose
        run: |
          docker compose exec -T api id | grep -q 'appuser'
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready
          set -a; source .env; set +a
          docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          docker compose exec -T mqtt-broker mosquitto_pub -h 127.0.0.1 -p 1883 -t health/ping -m ok

      - name: Run Newman end-to-end test on Compose stack
        working-directory: 05_Compose
        run: npm run test:compose

      - name: Verify readiness checklist (at least 6 checked items)
        working-directory: 05_Compose
        run: |
          CHECKLIST="checklists/readiness-checklist.md"
          TOTAL=$(grep -cE '^[[:space:]]*-[[:space:]]*\[[ xX]\]' "$CHECKLIST" || true)
          CHECKED=$(grep -cE '^[[:space:]]*-[[:space:]]*\[[xX]\]' "$CHECKLIST" || true)
          echo "Readiness checklist: ${CHECKED:-0}/${TOTAL:-0} checked"
          [ "${CHECKED:-0}" -ge 6 ]

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab05-notification-newman-reports
          path: 05_Compose/reports/

      - name: Dump Compose logs on failure
        if: failure()
        working-directory: 05_Compose
        run: docker compose logs

      - name: Tear down Compose stack
        if: always()
        working-directory: 05_Compose
        run: docker compose down -v

